name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Build release archives
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          targets='linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64
          windows arm64'
          while read -r os arch; do
            [ -n "$os" ] || continue
            stage="$(mktemp -d)"
            ext=''
            format='tar.gz'
            if [ "$os" = windows ]; then
              ext='.exe'
              format='zip'
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$stage/serenox$ext" ./cmd/serenox
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$stage/serenoxd$ext" ./cmd/serenoxd
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$stage/serenox-plugin$ext" ./cmd/serenox-plugin
            archive="dist/serenox_${os}_${arch}.${format}"
            if [ "$format" = tar.gz ]; then
              tar -C "$stage" -czf "$archive" serenox serenoxd serenox-plugin
            else
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/$archive" serenox.exe serenoxd.exe serenox-plugin.exe)
            fi
            rm -rf "$stage"
          done <<< "$targets"
          (cd dist && sha256sum serenox_* > checksums.txt)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

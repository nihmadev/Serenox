name: Documentation correction
description: Report an inaccurate, missing, or unclear Serenox documentation page.
title: "Docs: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Documentation page
      placeholder: https://docs.serenox.dev/docs/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Suggested correction or implementation evidence
      description: Link to relevant code, tests, or release behavior when available.
